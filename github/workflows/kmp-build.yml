name: KMP Build & Test

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
      - name: Build Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Run Shared Tests
        run: ./gradlew :shared:tes
t
